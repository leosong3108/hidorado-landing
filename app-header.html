<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>App Header Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas:       #05070F;
    --canvas-2:     #0A0E1E;
    --surface:      #10152A;
    --ink:          #F2F4FF;
    --ink-soft:     #B5BBD6;
    --accent:       #4361EE;
    --accent-hi:    #748FFC;
    --hairline:     rgba(232,235,255,0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: linear-gradient(to bottom, rgba(5,7,15,0.95), rgba(5,7,15,0.85));
    backdrop-filter: saturate(140%) blur(12px);
    -webkit-backdrop-filter: saturate(140%) blur(12px);
    border-bottom: 1px solid var(--hairline);
  }

  .app-header-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 12px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  @media (max-width: 640px) {
    .app-header-inner {
      padding: 12px 20px;
    }
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 18px;
    transition: all 0.2s;
    cursor: pointer;
    border: 1px solid transparent;
    text-decoration: none;
    flex-shrink: 0;
  }

  .back-btn:hover {
    background: var(--canvas-2);
    color: var(--accent);
    border-color: var(--accent);
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--ink);
    text-decoration: none;
    transition: opacity 0.2s;
  }

  .brand:hover {
    opacity: 0.8;
  }

  .brand .mark {
    width: 20px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    flex-shrink: 0;
    filter: drop-shadow(0 0 4px rgba(67,97,238,0.4));
    animation: breathe 2.8s ease-in-out infinite;
  }

  .brand .mark svg {
    width: 100%;
    height: 100%;
  }

  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(67,97,238,0.4)); }
    50%      { filter: drop-shadow(0 0 10px rgba(67,97,238,0.75)); }
  }

  @media (prefers-reduced-motion: reduce) {
    .brand .mark { animation: none; }
  }
</style>
</head>
<body style="background: var(--canvas); margin: 0; padding: 0;">

<!-- This is a reusable header component for app.hidorado.com -->
<header class="app-header">
  <div class="app-header-inner">
    <a href="https://hidorado.com" class="back-btn" title="Back to landing page">
      ←
    </a>
    <a href="https://hidorado.com" class="brand">
      <span class="mark">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
          <path d="M 12 12 C 22 12, 26 16, 26 24 C 26 32, 22 36, 12 36 L 12 12 Z" fill="#4361EE"/>
          <path d="M 36 12 C 26 12, 22 16, 22 24 C 22 32, 26 36, 36 36 L 36 12 Z" fill="#748FFC" fill-opacity="0.9"/>
          <circle cx="24" cy="24" r="1.8" fill="#F2F4FF"/>
        </svg>
      </span>
      <span>Dorado</span>
    </a>
  </div>
</header>

<div style="max-width: 1180px; margin: 0 auto; padding: 32px;">
  <p style="color: var(--ink-soft); font-family: 'Inter', sans-serif; font-size: 14px;">
    Copy the HTML above to add this header to app.hidorado.com pages. It includes:
  </p>
  <ul style="color: var(--ink-soft); font-family: 'Inter', sans-serif; font-size: 14px; margin-left: 20px; margin-top: 12px;">
    <li>Back arrow button linking to https://hidorado.com</li>
    <li>DD-mark logo with animated breathing effect</li>
    <li>Brand name "Dorado"</li>
    <li>Sticky positioning at top of page</li>
    <li>Responsive design for mobile</li>
  </ul>
</div>

</body>
</html>
