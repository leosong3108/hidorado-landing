<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Back to Dorado</title>
<meta name="description" content="Return to Dorado landing page" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas:       #05070F;
    --canvas-2:     #0A0E1E;
    --surface:      #10152A;
    --ink:          #F2F4FF;
    --ink-soft:     #B5BBD6;
    --ink-dim:      #7E85A0;
    --accent:       #4361EE;
    --accent-hi:    #748FFC;
    --accent-glow:  rgba(67,97,238,0.45);
    --hairline:     rgba(232,235,255,0.06);
    --radius-lg:    16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  html, body {
    background: var(--canvas);
    color: var(--ink);
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  img, svg { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 32px;
  }

  .content {
    text-align: center;
    max-width: 480px;
  }

  .logo {
    width: 80px;
    height: 80px;
    margin: 0 auto 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    filter: drop-shadow(0 0 12px rgba(67,97,238,0.4));
    animation: breathe 2.8s ease-in-out infinite;
  }

  .logo svg {
    width: 100%;
    height: 100%;
  }

  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(67,97,238,0.4)); }
    50%      { filter: drop-shadow(0 0 16px rgba(67,97,238,0.75)); }
  }

  h1 {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin-bottom: 12px;
    color: var(--ink);
  }

  .description {
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 32px;
    line-height: 1.6;
  }

  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn {
    padding: 14px 28px;
    border-radius: var(--radius-lg);
    font-size: 15px;
    font-weight: 600;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover {
    background: var(--accent-hi);
    box-shadow: 0 8px 24px rgba(67,97,238,0.35);
  }

  .btn-secondary {
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--hairline);
  }

  .btn-secondary:hover {
    background: var(--canvas-2);
    border-color: var(--accent);
    color: var(--accent);
  }

  .icon {
    width: 18px;
    height: 18px;
  }

  @media (max-width: 640px) {
    .container {
      padding: 32px 20px;
    }

    h1 {
      font-size: 20px;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 24px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <div class="content">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
        <path d="M 12 12 C 22 12, 26 16, 26 24 C 26 32, 22 36, 12 36 L 12 12 Z" fill="#4361EE"/>
        <path d="M 36 12 C 26 12, 22 16, 22 24 C 22 32, 26 36, 36 36 L 36 12 Z" fill="#748FFC" fill-opacity="0.9"/>
        <circle cx="24" cy="24" r="1.8" fill="#F2F4FF" class="spark"/>
      </svg>
    </div>

    <h1>Dorado</h1>
    <p class="description">
      Return to the main landing page to explore Dorado's capabilities.
    </p>

    <div class="btn-group">
      <a href="https://hidorado.com" class="btn btn-primary">
        <span>← Back to Dorado</span>
      </a>
      <a href="https://hidorado.com#how-it-works" class="btn btn-secondary">
        Learn how it works
      </a>
    </div>
  </div>
</div>

<script>
  // Restore spark animation from CSS
  const spark = document.querySelector('.spark');
  if (spark && spark.animate) {
    spark.animate([
      { opacity: '0.55', r: '1.5' },
      { opacity: '1', r: '2.3' },
      { opacity: '0.55', r: '1.5' }
    ], {
      duration: 2200,
      iterations: Infinity,
      easing: 'ease-in-out'
    });
  }
</script>

</body>
</html>
